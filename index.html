<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Validação de Solicitações – Projeto Natureza</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>/* Layout: cabeçalho com logos, barra fixa de ações, texto do documento, duas grades de resposta e aprovação */
:root{
  --bg:#f4f5f1;--card:#ffffff;--line:#d5dcd6;--soft:#e6efe9;--fg:#26302b;--strong:#111a15;--muted:#64706a;
  --acc:#1f5c3a;--acc-ink:#ffffff;--warn:#8a5a06;--warn-bg:#f8e7c2;--err:#b42318;--err-bg:#fbe4e1;--ok:#1f5c3a;--ok-bg:#dcefe3;
  --display:'IBM Plex Sans Condensed','Arial Narrow',sans-serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.top{background:var(--card);border-bottom:3px solid var(--acc)}
header.top .wrap{display:flex;align-items:center;gap:18px;padding-top:16px;padding-bottom:14px}
.logo{width:72px;height:72px;object-fit:contain;flex:none;border-radius:6px}
.tt{flex:1;min-width:0;text-align:center}
.tt h1{margin:0;font:700 28px/1.15 var(--display);color:var(--acc);text-wrap:balance}
.tt p{margin:4px 0 0;color:var(--muted);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:4px 22px;padding:10px 0 12px;font-size:13px;color:var(--muted)}
.meta b{color:var(--fg);font-weight:600}

.bar{position:sticky;top:0;z-index:5;background:var(--soft);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding-top:9px;padding-bottom:9px}
.state{margin-right:auto;font-size:13px;min-width:0}
.state b{font-weight:600;color:var(--strong)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--card);border:1px solid var(--line);margin-right:6px}
.pill.ed{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn{font:600 13px/1 var(--body);padding:9px 13px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
body.busy .btn{pointer-events:none;opacity:.6}

#msg{margin:14px 0 0;padding:10px 14px;border-radius:8px;font-size:14px;background:var(--soft);border:1px solid var(--line)}
#msg.err{background:var(--err-bg);border-color:#efb8b1;color:var(--err)}
#msg.ok{background:var(--ok-bg);border-color:#b5d6c2;color:var(--ok)}
#msg.warn{background:var(--warn-bg);border-color:#e6cf93;color:var(--warn)}

.panel{margin:14px 0 0;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px}
.panel h3{margin:0 0 6px;font:700 18px/1.2 var(--display);color:var(--strong)}
.panel p{margin:0 0 12px;font-size:14px;color:var(--muted);max-width:78ch}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:12px}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.f input{width:100%;font:15px var(--body);padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--fg)}
.pa{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pa a{font-size:13px;color:var(--acc)}

main{padding:6px 0 60px}
section.blk{margin-top:26px}
h2{margin:0 0 10px;font:700 21px/1.2 var(--display);color:var(--acc)}
.txt p{margin:0 0 9px;max-width:100ch}
.txt ol{margin:0 0 9px;padding-left:22px}
.sum{font-size:13px;color:var(--muted);margin:-4px 0 10px}
.sum b{color:var(--fg)}

.grid{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:grid;gap:0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.g1 .row{grid-template-columns:48px minmax(0,1.05fr) minmax(0,1.7fr) 132px minmax(0,1.25fr)}
.g2 .row{grid-template-columns:48px 96px minmax(0,1.5fr) minmax(0,1.3fr)}
.row>div{padding:9px 11px;border-left:1px solid var(--line);min-width:0;font-size:14px}
.row>div:first-child{border-left:0}
.row.hd{background:var(--soft)}
.row.hd>div{font-size:12px;font-weight:700;color:var(--acc)}
.n{text-align:center;font-weight:700;color:var(--strong)}
.c{text-align:center}
.row select,.row textarea{width:100%;font:14px/1.4 var(--body);color:var(--fg);background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.row textarea{resize:none;overflow:hidden;min-height:34px;display:block}
select[data-v="Sim"]{background:var(--ok-bg);border-color:#b5d6c2}
select[data-v="Não"]{background:var(--err-bg);border-color:#efb8b1}
select[data-v="Ajustar"]{background:var(--warn-bg);border-color:#e6cf93}
select:disabled,textarea:disabled,.ap input:disabled{opacity:1;color:var(--fg);-webkit-text-fill-color:var(--fg);cursor:default}
textarea:disabled,.ap input[type=text]:disabled,.ap input[type=date]:disabled{background:transparent;border-color:transparent;padding-left:0}
select:disabled{appearance:none;-webkit-appearance:none;text-align:center;font-weight:600}
select:disabled:not([data-v="Sim"]):not([data-v="Não"]):not([data-v="Ajustar"]){background:transparent;border-color:transparent;color:var(--muted);-webkit-text-fill-color:var(--muted);font-weight:400}

.ap{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.ap p{margin:0 0 12px;max-width:100ch}
.ap .opt{display:flex;align-items:center;gap:9px;padding:5px 0}
.ap .opt input{width:18px;height:18px;accent-color:var(--acc);margin:0}
.ap .pg{margin:14px 0 0}
.ap .f input{max-width:340px}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:46px;text-align:center;font-size:14px}
.sig div{border-top:1px solid var(--fg);padding-top:6px}
footer{margin-top:30px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
footer button{background:none;border:0;padding:0;font:inherit;color:var(--acc);text-decoration:underline;cursor:pointer}

@media(max-width:860px){
  .tt h1{font-size:21px}.logo{width:52px;height:52px}
  .row.hd{display:none}
  .g1 .row,.g2 .row{grid-template-columns:44px minmax(0,1fr)}
  .row>div{border-left:0;padding:5px 12px}
  .row>div.n{grid-row:1 / span 5;border-right:1px solid var(--line);padding-top:10px}
  .row>div:nth-child(2){padding-top:10px;font-weight:600}
  .row>div:last-child{padding-bottom:11px}
  .row>div[data-l]::before{content:attr(data-l);display:block;font-size:11px;font-weight:700;color:var(--acc);margin-bottom:2px}
  .c{text-align:left}.c select{max-width:180px}
  .sig{grid-template-columns:1fr;gap:46px}
}
@media print{
  body{background:#fff;font-size:11pt}
  .bar,#msg,.panel,footer{display:none!important}
  .wrap{max-width:none;padding:0}
  .row{break-inside:avoid}
  .grid,.ap{border-radius:0}
  section.blk{margin-top:16pt}
  select,textarea,input{border-color:transparent!important;background:transparent!important;padding-left:0!important}
}
</style></head><body>

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function enc(s){return encodeURIComponent(s)}
function ssGet(){try{return JSON.parse(sessionStorage.getItem(SS)||"null")}catch(e){return null}}

/* ---- repositório (deduzido do endereço do GitHub Pages) ---- */
function guess(){
  if(CONFIG.owner&&CONFIG.repo)return{owner:CONFIG.owner,repo:CONFIG.repo,dir:CONFIG.pasta||""};
  var m=location.hostname.match(/^([^.]+)\.github\.io$/i), seg=location.pathname.split("/").filter(Boolean).map(decodeURIComponent);
  if(!m)return{owner:"",repo:"",dir:""};
  var owner=m[1], repo, rest;
  if(seg.length&&!/\.html?$/i.test(seg[0])){repo=seg[0];rest=seg.slice(1)}else{repo=owner+".github.io";rest=seg}
  if(rest.length&&/\.html?$/i.test(rest[rest.length-1]))rest.pop();
  return{owner:owner,repo:repo,dir:rest.join("/")};
}
var G=guess();
function apiUrl(name){
  var p=(G.dir?G.dir+"/":"")+name;
  return"https://api.github.com/repos/"+enc(G.owner)+"/"+enc(G.repo)+"/contents/"+p.split("/").map(enc).join("/")+(CONFIG.branch?"?ref="+enc(CONFIG.branch):"");
}
function hdr(tok){var h={"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};if(tok)h.Authorization="Bearer "+tok;return h}

/* ---- base64 / utf-8 ---- */
function b64(bytes){var s="",i;for(i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s)}
function unb64(str){var s=atob(String(str).replace(/\s+/g,"")),a=new Uint8Array(s.length),i;for(i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function utf8(s){return new TextEncoder().encode(s)}
function text(bytes){return new TextDecoder().decode(bytes)}

/* ---- leitura e gravação de arquivos no GitHub ---- */
function relFile(name){
  return fetch(name,{cache:"no-store"}).then(function(r){
    if(r.status===404)return{missing:true,sha:null};
    if(!r.ok)throw r.status;
    return r.text().then(function(t){return{sha:null,text:t}});
  });
}
function getFile(name,tok){
  if(!G.owner)return relFile(name);
  return fetch(apiUrl(name),{headers:hdr(tok),cache:"no-store"}).then(function(r){
    if(r.status===404)return{missing:true,sha:null};
    if(!r.ok)throw r.status;
    return r.json().then(function(j){return{sha:j.sha,text:text(unb64(j.content||""))}});
  }).catch(function(e){
    if(tok)throw e;
    return relFile(name);
  });
}
function putFile(name,body,sha,tok,message){
  var payload={message:message,content:b64(utf8(body))};
  if(sha)payload.sha=sha;
  if(CONFIG.branch)payload.branch=CONFIG.branch;
  return fetch(apiUrl(name),{method:"PUT",headers:hdr(tok),body:JSON.stringify(payload)}).then(function(r){
    if(!r.ok)throw r.status;
    return r.json().then(function(j){return j.content&&j.content.sha});
  });
}
function errText(st){
  if(st===401)return"O acesso ao GitHub guardado nesta página expirou ou foi revogado. Peça ao administrador para definir a senha de novo em Administração.";
  if(st===403)return"O GitHub recusou a gravação: o token não tem permissão de escrita neste repositório, ou o limite de acessos foi atingido. Tente de novo em alguns minutos.";
  if(st===404)return"Repositório não encontrado ou o token não dá acesso a ele.";
  if(st===409||st===422)return"Outra pessoa salvou antes de você. Clique em Atualizar para carregar a versão dela e refaça suas alterações.";
  return"Não foi possível falar com o GitHub"+(typeof st==="number"?" (código "+st+")":"")+". Confira a internet e tente de novo.";
}

/* ---- senha: o token do GitHub fica cifrado com ela no acesso.json ---- */
function deriveKey(pass,salt,iter){
  return crypto.subtle.importKey("raw",utf8(pass),"PBKDF2",false,["deriveKey"]).then(function(k){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:iter,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
  });
}
function seal(token,pass){
  var salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  return deriveKey(pass,salt,ITER).then(function(k){return crypto.subtle.encrypt({name:"AES-GCM",iv:iv},k,utf8(token))}).then(function(ct){
    return{v:1,kdf:"PBKDF2-SHA256",iter:ITER,salt:b64(salt),iv:b64(iv),ct:b64(new Uint8Array(ct))};
  });
}
function unseal(box,pass){
  var iter=Math.min(Math.max(parseInt(box.iter,10)||ITER,100000),5000000);
  return deriveKey(pass,unb64(box.salt),iter).then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(box.iv)},k,unb64(box.ct))}).then(function(pt){return text(new Uint8Array(pt))});
}

/* ---- estado ---- */
function blank(){return{v:1,updated:"",by:"",solic:{},pts:{},aprov:{status:"",data:"",nome:""}}}
function normalize(d){
  var o=blank();
  if(!d||typeof d!=="object")return o;
  o.updated=String(d.updated||"");o.by=String(d.by||"");
  SOLIC.forEach(function(s){var x=d.solic&&d.solic[s[0]];if(x)o.solic[s[0]]={c:String(x.c||""),o:String(x.o||"")}});
  PTS.forEach(function(p){var x=d.pts&&d.pts[p[0]];if(x)o.pts[p[0]]=String(x)});
  if(d.aprov){o.aprov.status=String(d.aprov.status||"");o.aprov.data=String(d.aprov.data||"");o.aprov.nome=String(d.aprov.nome||"")}
  return o;
}
var ADMIN=/(^|[?&#])admin\b/i.test(location.search+location.hash), hasPass=null;
function admVis(){$("adm").hidden=!(ADMIN||hasPass===false)}
var data=blank(), sha=null, token=null, who="", dirty=false, busy=false, panel=null, armed=false;

function say(m,k){var e=$("msg");e.textContent=m||"";e.className=k||"";e.hidden=!m}
function setBusy(b){busy=b;document.body.classList.toggle("busy",b)}
function br(iso){try{var d=new Date(iso);return isNaN(d)?"":d.toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})}catch(e){return""}}
function grow(t){t.style.height="auto";t.style.height=(t.scrollHeight+2)+"px"}

/* ---- página ---- */
function build(){
  var h='<header class="top"><div class="wrap"><img class="logo" src="'+LOGO_JES+'" alt="JESCIPE">'
   +'<div class="tt"><h1>Validação de Solicitações – Projeto Natureza</h1><p>Setor solicitante: Contabilidade</p></div>'
   +'<img class="logo" src="'+LOGO_CLI+'" alt="Preserve Liserve"></div></header>'
   +'<div class="bar"><div class="wrap" id="bar"></div></div>'
   +'<main><div class="wrap">'
   +'<div class="meta"><span><b>Data:</b> 12 de nov. de 2026</span><span><b>Fornecedor:</b> JESCIPE</span><span><b>Analista responsável:</b> Josué Izidio</span><span><b>Cliente:</b> Preserve</span><span><b>Usuário responsável:</b> Marcos André</span></div>'
   +'<div id="msg" role="status" aria-live="polite" hidden></div><div id="panel"></div>'
   +'<section class="blk txt"><h2>Objetivo</h2>'

   +'<p><b>Como responder:</b></p><ol><li>Na tabela de solicitações, marque cada item como <b>Sim</b>, <b>Não</b> ou <b>Ajustar</b> e descreva o ajuste na coluna de observação.</li><li>Responda os pontos em aberto, que hoje impedem fechar o escopo.</li><li>Preencha o aceite no final e clique em <b>Salvar</b>.</li></ol></section>'
   +'<section class="blk txt"><h2>Entendimento do projeto</h2>'
   +'<p>A natureza passa a ser definida pela contabilidade no cadastro de produtos e segue automaticamente do produto para a solicitação de compras, o pedido de compras e o documento de entrada. O mesmo controle vale para os títulos digitados diretamente no contas a pagar.</p>'
   +'<p>Na contabilização, cada natureza terá duas contas contábeis, administrativa e operacional, e o lançamento padrão escolherá uma delas conforme o tipo de operação. A classe de valor deixa de ser usada nas tabelas de compras, estoque e financeiro listadas no item 5.</p>'
   +'<p><b>Base:</b> planilha Excel com código do produto e natureza, a ser importada para o cadastro de produtos (item 2).</p></section>';

  h+='<section class="blk"><h2>Solicitações a validar</h2><div class="sum" id="sum1"></div><div class="grid g1">'
   +'<div class="row hd"><div class="n">Nº</div><div>Solicitação</div><div>Atividade</div><div class="c">Confere?</div><div>Observação do cliente</div></div>';
  SOLIC.forEach(function(s){
    h+='<div class="row"><div class="n">'+s[0]+'</div><div>'+esc(s[1])+'</div><div data-l="Atividade">'+esc(s[2])+'</div>'
     +'<div class="c" data-l="Confere?"><select data-k="c:'+s[0]+'" aria-label="Item '+s[0]+': confere?"><option value="">—</option><option>Sim</option><option>Não</option><option>Ajustar</option></select></div>'
     +'<div data-l="Observação do cliente"><textarea rows="1" data-k="o:'+s[0]+'" aria-label="Item '+s[0]+': observação do cliente"></textarea></div></div>';
  });
  h+='</div></section>';

  h+='<section class="blk"><h2>Pontos em aberto</h2><div class="sum" id="sum2"></div><div class="grid g2">'
   +'<div class="row hd"><div class="n">Nº</div><div class="c">Itens relacionados</div><div>Pergunta</div><div>Resposta do cliente</div></div>';
  PTS.forEach(function(p){
    h+='<div class="row"><div class="n">'+p[0]+'</div><div class="c" data-l="Itens relacionados">'+esc(p[1])+'</div><div data-l="Pergunta">'+esc(p[2])+'</div>'
     +'<div data-l="Resposta do cliente"><textarea rows="1" data-k="r:'+p[0]+'" aria-label="Ponto '+p[0]+': resposta do cliente"></textarea></div></div>';
  });
  h+='</div></section>';

  h+='<section class="blk"><h2>Aprovação</h2><div class="ap"><p>Ao aprovar, o cliente confirma que as solicitações marcadas como "Sim", com os ajustes anotados, representam o escopo do projeto. Itens novos ou alterados após o aceite serão tratados como mudança de escopo.</p>';
  APROV.forEach(function(a,i){h+='<label class="opt"><input type="radio" name="ap" data-k="ap" value="'+esc(a)+'" id="ap'+i+'"><span>'+esc(a)+'</span></label>'});
  h+='<div class="pg"><div class="f"><label for="apn">Aprovado por</label><input type="text" id="apn" data-k="apn" autocomplete="off"></div>'
   +'<div class="f"><label for="apd">Data</label><input type="date" id="apd" data-k="apd"></div></div>'
   +'<div class="sig"><div>Josué Izidio – JESCIPE</div><div>Marcos André – Preserve</div></div></div></section>'
   +'<footer><span id="upd"></span><button type="button" data-act="admin" id="adm" hidden>Administração: definir ou trocar a senha</button></footer>'
   +'</div></main>';
  $("app").innerHTML=h;
}

function fields(){return Array.prototype.slice.call(document.querySelectorAll("[data-k]"))}
function apply(){
  fields().forEach(function(el){
    var k=el.getAttribute("data-k").split(":"), id=k[1], s;
    if(k[0]==="c"){s=data.solic[id];el.value=s?s.c:"";el.setAttribute("data-v",el.value)}
    else if(k[0]==="o"){s=data.solic[id];el.value=s?s.o:""}
    else if(k[0]==="r"){el.value=data.pts[id]||""}
    else if(k[0]==="ap"){el.checked=data.aprov.status===el.value}
    else if(k[0]==="apn"){el.value=data.aprov.nome}
    else if(k[0]==="apd"){el.value=data.aprov.data}
    el.disabled=!token;
    if(el.tagName==="TEXTAREA"){el.placeholder=token?"Digite aqui":"";grow(el)}
  });
  sums();
  $("upd").textContent=data.updated?"Última gravação: "+br(data.updated)+(data.by?" por "+data.by:""):"Ainda sem respostas gravadas.";
}
function sums(){
  var a=SOLIC.filter(function(s){return data.solic[s[0]]&&data.solic[s[0]].c}).length;
  var b=PTS.filter(function(p){return(data.pts[p[0]]||"").trim()}).length;
  $("sum1").innerHTML="<b>"+a+" de "+SOLIC.length+"</b> solicitações respondidas";
  $("sum2").innerHTML="<b>"+b+" de "+PTS.length+"</b> pontos respondidos";
}
function bar(){
  var h;
  if(token){
    h='<div class="state"><span class="pill ed">Edição</span>'+(who?"Editando como <b>"+esc(who)+"</b>":"Edição liberada")+(dirty?" · <b>alterações não salvas</b>":"")+'</div>'
     +'<button class="btn pri" data-act="save"'+(dirty?"":" disabled")+'>Salvar</button>';
  }else{
    h='<div class="state"><span class="pill">Visualização</span>Para responder, entre com a senha.</div>'
     +'<button class="btn pri" data-act="login">Entrar com senha</button>';
  }
  h+='<button class="btn" data-act="refresh">'+(armed?"Confirmar: descartar alterações":"Atualizar")+'</button>'
    +'<button class="btn" data-act="print">Imprimir</button>'
    +(token?'<button class="btn" data-act="out">Sair</button>':"");
  $("bar").innerHTML=h;
}
function showPanel(p){
  panel=p;var h="";
  if(p==="login"){
    h='<section class="panel"><h3>Entrar para responder</h3><p>Informe a senha que você recebeu junto com o link. O nome fica registrado ao lado da data da última gravação.</p>'
     +'<form id="f-login"><div class="pg"><div class="f"><label for="l-pass">Senha</label><input id="l-pass" type="password" autocomplete="current-password" required></div>'
     +'<div class="f"><label for="l-who">Seu nome</label><input id="l-who" type="text" autocomplete="name" required></div></div>'
     +'<div class="pa"><button class="btn pri" type="submit">Entrar</button><button class="btn" type="button" data-act="close">Fechar</button></div></form></section>';
  }else if(p==="admin"){
    h='<section class="panel"><h3>Administração: definir ou trocar a senha</h3>'
     +'<p>Só o dono do repositório precisa usar esta parte, uma vez. O token do GitHub é cifrado com a senha escolhida e gravado no arquivo <b>acesso.json</b> do repositório. Depois disso, quem tiver o link e a senha consegue editar e salvar, sem precisar de token.</p>'
     +'<p>Use um token <i>fine-grained</i> com acesso <b>somente a este repositório</b> e permissão <b>Contents: Read and write</b>. Escolha uma senha longa (uma frase), porque o arquivo cifrado fica público.</p>'
     +'<form id="f-admin"><div class="pg"><div class="f"><label for="a-tok">Token do GitHub</label><input id="a-tok" type="password" autocomplete="off" placeholder="github_pat_…" required></div>'
     +'<div class="f"><label for="a-p1">Nova senha (mínimo '+MINPASS+' caracteres)</label><input id="a-p1" type="password" autocomplete="new-password" minlength="'+MINPASS+'" required></div>'
     +'<div class="f"><label for="a-p2">Repita a senha</label><input id="a-p2" type="password" autocomplete="new-password" required></div>'
     +'<div class="f"><label for="a-who">Seu nome</label><input id="a-who" type="text" autocomplete="name" required></div></div>'
     +'<div class="pa"><button class="btn pri" type="submit">Gravar senha</button><button class="btn" type="button" data-act="close">Fechar</button>'
     +'<a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Gerar token no GitHub</a></div></form></section>';
  }
  $("panel").innerHTML=h;
  var first=$("panel").querySelector("input");if(first)first.focus();
}
function needPages(){
  if(G.owner)return false;
  say("Esta é uma pré-visualização. Entrar e salvar só funcionam quando a página é aberta pelo link do GitHub Pages.","warn");return true;
}
function enter(tok,name){token=tok;who=name;ssSet({t:tok,w:name});showPanel(null);bar();apply()}

/* ---- ações ---- */
function load(quiet){
  setBusy(true);
  return getFile(CONFIG.dados,token).then(function(f){
    if(f.missing){data=blank();sha=null}
    else{data=normalize(JSON.parse(f.text));sha=f.sha}
    dirty=false;armed=false;
    if(!quiet)say("Versão mais recente carregada.","ok");
  }).catch(function(e){
    if(G.owner||!quiet)say(typeof e==="number"?errText(e):"Não foi possível carregar as respostas gravadas.","err");
  }).then(function(){setBusy(false);bar();apply()});
}
function login(pass,name){
  if(needPages())return;
  setBusy(true);say("Conferindo a senha…");
  getFile(CONFIG.acesso,null).then(function(f){
    if(f.missing){hasPass=false;admVis();throw"nopass"}
    hasPass=true;admVis();
    return unseal(JSON.parse(f.text),pass).catch(function(){throw"bad"});
  }).then(function(tok){
    enter(tok,name);say("Edição liberada. Responda e clique em Salvar.","ok");
    setBusy(false);
    if(!dirty)return load(true);
  }).catch(function(e){
    setBusy(false);
    if(e==="nopass")say("A senha desta página ainda não foi definida. O administrador precisa fazer isso em Administração, no fim da página.","warn");
    else if(e==="bad")say("Senha incorreta.","err");
    else say(typeof e==="number"?errText(e):"Não foi possível conferir a senha. Tente de novo.","err");
  });
}
function admin(tok,p1,p2,name){
  if(needPages())return;
  if(p1.length<MINPASS)return say("A senha precisa ter pelo menos "+MINPASS+" caracteres.","err");
  if(p1!==p2)return say("As duas senhas não são iguais.","err");
  setBusy(true);say("Gravando a senha no repositório…");
  var box;
  seal(tok,p1).then(function(b){box=b;return getFile(CONFIG.acesso,tok)}).then(function(f){
    return putFile(CONFIG.acesso,JSON.stringify(box,null,2)+"\n",f.sha,tok,"Define a senha de edição da página");
  }).then(function(){
    hasPass=true;admVis();enter(tok,name);say("Senha gravada. Agora quem tiver o link e essa senha consegue editar e salvar.","ok");
    setBusy(false);
    if(!dirty)return load(true);
  }).catch(function(e){
    setBusy(false);
    if(e===401)say("Token inválido ou expirado. Gere um novo no GitHub e tente de novo.","err");
    else if(e===403||e===404)say("Este token não tem permissão de escrita neste repositório. Confira se ele dá acesso a "+G.owner+"/"+G.repo+" com Contents: Read and write.","err");
    else say(typeof e==="number"?errText(e):"Este navegador não conseguiu cifrar o token. Abra a página pelo link https do GitHub Pages.","err");
  });
}
function save(){
  if(!token||!dirty||busy)return;
  setBusy(true);say("Salvando…");
  data.updated=new Date().toISOString();data.by=who;
  var body=JSON.stringify(data,null,2)+"\n";
  var pre=sha?Promise.resolve(sha):getFile(CONFIG.dados,token).then(function(f){return f.sha});
  pre.then(function(s){return putFile(CONFIG.dados,body,s,token,"Atualiza respostas da validação"+(who?" ("+who+")":""))}).then(function(ns){
    sha=ns||null;dirty=false;say("Respostas salvas no GitHub em "+br(data.updated)+".","ok");
  }).catch(function(e){say(errText(e),"err")}).then(function(){setBusy(false);bar();apply()});
}

document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-act]");if(!b||busy)return;
  var a=b.getAttribute("data-act");
  if(a!=="refresh"&&armed){armed=false;bar()}
  if(a==="login"){say("");showPanel(panel==="login"?null:"login")}
  else if(a==="admin"){say("");showPanel("admin");$("panel").scrollIntoView({block:"center"})}
  else if(a==="close"){showPanel(null)}
  else if(a==="save"){save()}
  else if(a==="print"){window.print()}
  else if(a==="out"){
    if(dirty){say("Há alterações não salvas. Salve antes de sair, ou clique em Atualizar para descartá-las.","warn");return}
    token=null;who="";ssSet(null);say("Você saiu. A página voltou para o modo de visualização.");bar();apply();
  }
  else if(a==="refresh"){
    if(dirty&&!armed){armed=true;bar();say("Você tem alterações não salvas. Clique de novo em Atualizar para descartá-las.","warn");return}
    load(false);
  }
});
document.addEventListener("submit",function(ev){
  ev.preventDefault();if(busy)return;
  if(ev.target.id==="f-login")login($("l-pass").value,$("l-who").value.trim());
  else if(ev.target.id==="f-admin")admin($("a-tok").value.trim(),$("a-p1").value,$("a-p2").value,$("a-who").value.trim());
});
function onField(ev){
  var el=ev.target, k=el.getAttribute&&el.getAttribute("data-k");if(!k||!token)return;
  k=k.split(":");var id=k[1];
  if(k[0]==="c"||k[0]==="o"){
    var s=data.solic[id]||(data.solic[id]={c:"",o:""});
    if(k[0]==="c"){s.c=el.value;el.setAttribute("data-v",el.value)}else s.o=el.value;
  }
  else if(k[0]==="r")data.pts[id]=el.value;
  else if(k[0]==="ap"){if(el.checked)data.aprov.status=el.value}
  else if(k[0]==="apn")data.aprov.nome=el.value;
  else if(k[0]==="apd")data.aprov.data=el.value;
  if(el.tagName==="TEXTAREA")grow(el);
  sums();
  if(!dirty){dirty=true;bar()}
}
document.addEventListener("input",onField);
document.addEventListener("change",onField);
window.addEventListener("beforeunload",function(ev){if(dirty){ev.preventDefault();ev.returnValue=""}});
window.addEventListener("resize",function(){fields().forEach(function(el){if(el.tagName==="TEXTAREA")grow(el)})});
window.addEventListener("beforeprint",function(){fields().forEach(function(el){if(el.tagName==="TEXTAREA")grow(el)})});

build();
var s=ssGet();if(s&&s.t&&G.owner){token=s.t;who=s.w||""}
bar();apply();admVis();
load(true).then(function(){return getFile(CONFIG.acesso,null)}).then(function(f){hasPass=!f.missing;admVis();if(ADMIN&&!panel)showPanel("admin")}).catch(function(){if(ADMIN&&!panel)showPanel("admin")});
})();
</script>
